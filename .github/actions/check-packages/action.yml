name: Package Age Guard
description: Check npm package publication ages against your policy
author: Meon Valley Web
branding:
  icon: shield
  color: red
inputs:
  min-age:
    description: Minimum package age in days
    default: '7'
  production-only:
    description: Check production dependencies only
    default: 'false'
  strict:
    description: Fail on warnings as well as violations and errors
    default: 'false'
  suggest:
    description: Include age-compliant version suggestions
    default: 'true'
  json-output:
    description: Print JSON instead of the human-readable report
    default: 'false'
  config-file:
    description: Path to a JSON config file (empty uses automatic discovery)
    default: ''
outputs:
  violations:
    description: Number of packages that are too new
    value: ${{ steps.check.outputs.violations }}
  warnings:
    description: Number of warnings
    value: ${{ steps.check.outputs.warnings }}
  passed:
    description: Number of packages that passed
    value: ${{ steps.check.outputs.passed }}
  total:
    description: Total packages checked
    value: ${{ steps.check.outputs.total }}
  results-json:
    description: Full check results as compact JSON
    value: ${{ steps.check.outputs.results-json }}
  has-violations:
    description: Whether any package is too new
    value: ${{ steps.check.outputs.has-violations }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Check package ages
      id: check
      shell: bash
      env:
        PAG_ACTION_PATH: ${{ github.action_path }}
        PAG_MIN_AGE: ${{ inputs.min-age }}
        PAG_PRODUCTION: ${{ inputs.production-only }}
        PAG_STRICT: ${{ inputs.strict }}
        PAG_SUGGEST: ${{ inputs.suggest }}
        PAG_JSON: ${{ inputs.json-output }}
        PAG_CONFIG: ${{ inputs.config-file }}
      run: node "$PAG_ACTION_PATH/run.mjs"
